# Builds with full Ruby from the Gemfile (not the github-pages gem), so any plugin works.
name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: Submit every URL in the sitemap to IndexNow, not just changed ones
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # jekyll-last-modified-at reads git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install pillow pillow-avif-plugin

      # Restore previously converted images; the script only re-encodes images whose hash changed
      - name: Cache converted images
        uses: actions/cache@v4
        with:
          path: |
            assets/**/*.webp
            assets/**/*.avif
            assets/**/*_l.png
            assets/.conversion-manifest.json
          key: images-${{ hashFiles('assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.jpeg', 'scripts/imageConversion.py') }}
          restore-keys: images-

      - name: Make AVIF/WebP and mobile image variants
        run: python scripts/imageConversion.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Check responsive image plugin
        run: bundle exec ruby scripts/test_responsive_images.rb

      - name: Build site with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Before the deploy, while the live sitemap is still the old one to compare against
      - name: List new and changed URLs for IndexNow
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt || true
          fi
          python scripts/indexnow.py indexnow.json --changed changed.txt ${{ inputs.indexnow_all && '--all' || '' }}

      - name: Upload IndexNow list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing, Yandex and the other IndexNow engines about new and changed pages
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow

      - name: Submit to IndexNow
        run: |
          if [ "$(cat indexnow.json)" = "{}" ]; then echo "Nothing to submit"; exit 0; fi
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json)
          echo "IndexNow responded $code"; cat response.txt
          [ "$code" = "200" ] || [ "$code" = "202" ]
