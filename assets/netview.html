<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEXF Graph Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';


        class GEXFGraphViewer {
            constructor(container) {
                this.container = container || document.body;
                this.init();
            }

            init() {
                // Scene, Camera, Renderer
                this.scene = new THREE.Scene();
                const camera = new THREE.OrthographicCamera(
                    -zoomFactor * aspect, // left
                    zoomFactor * aspect,  // right
                    zoomFactor,           // top
                    -zoomFactor,          // bottom
                    1,                    // near plane
                    5000                  // far plane
                );

                // Position the camera and look at the scene
                //camera.position.set(200, 200, 200); // Adjust as needed for a good view
                camera.lookAt(0, 0, 0);  // Make sure the camera looks at the center of the scene
                this.camera.position.z = 2000;

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.container.appendChild(this.renderer.domElement);

                // OrbitControls
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.1;
                this.controls.rotateSpeed = 0.0;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                const pointLight = new THREE.PointLight(0xffffff, 1);
                pointLight.position.set(50, 50, 50);
                this.scene.add(ambientLight, pointLight);

                // Handle Resizing
                window.addEventListener('resize', this.onWindowResize.bind(this));

                // Graph Data
                this.graphData = { nodes: [], edges: [] };

                // Start Animation Loop
                this.animate();
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            loadGEXF(url) {
                fetch(url)
                    .then(response => response.text())
                    .then(data => {
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(data, 'application/xml');
                        this.parseGraph(xml);
                        this.renderGraph();
                    })
                    .catch(error => console.error('Error loading GEXF:', error));
            }

        parseGraph(xml) {
            const nodes = Array.from(xml.querySelectorAll('node')).map(node => {
                // Extract attributes
                const id = node.getAttribute('id');
                const label = node.getAttribute('label') || id;

                // Extract position
                const positionNode = node.querySelector('viz\\:position, position');
                const position = positionNode
                    ? {
                        x: parseFloat(positionNode.getAttribute('x')),
                        y: parseFloat(positionNode.getAttribute('y')),
                        z: parseFloat(positionNode.getAttribute('z')),
                    }
                    : { x: Math.random() * 100 - 50, y: Math.random() * 100 - 50, z: Math.random() * 100 - 50 };

                // Extract color
                const colorNode = node.querySelector('viz\\:color, color');
                const color = colorNode
                    ? `rgb(${colorNode.getAttribute('r')}, ${colorNode.getAttribute('g')}, ${colorNode.getAttribute('b')})`
                    : '#00ff00'; // Default to green

                // Extract size
                const sizeNode = node.querySelector('viz\\:size, size');
                const size = sizeNode ? parseFloat(sizeNode.getAttribute('value')) : 1.5; // Default size

                return { id, label, position, color, size };
            });

            const edges = Array.from(xml.querySelectorAll('edge')).map(edge => ({
                source: edge.getAttribute('source'),
                target: edge.getAttribute('target'),
            }));

            this.graphData = { nodes, edges };
        }

        renderGraph() {
    const { nodes, edges } = this.graphData;

    // Render Nodes and Labels
    nodes.forEach(node => {
        // Create the node (sphere)
        const geometry = new THREE.SphereGeometry(node.size / 2);
        const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(node.color) });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(node.position.x, node.position.y, node.position.z);
        this.scene.add(sphere);

        node.object = sphere;

        // Create text label for node
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        // Increase the font size to make text much bigger
        context.font = '100px Arial';  // Set the font size to 100px
        context.fillStyle = 'white';

        // Measure the text width and height for proper scaling
        const labelWidth = context.measureText(node.label).width;
        const labelHeight = 100; // This corresponds to the font size used

        // Adjust the canvas size to fit the label
        canvas.width = labelWidth + 20;  // Add some padding
        canvas.height = labelHeight + 20;  // Add some padding
        context.fillText(node.label, 10, labelHeight - 10);  // Draw text with padding

        // Create the texture for the label
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMaterial);

        // Scale the sprite based on text size
        sprite.scale.set(labelWidth , labelHeight, 1);  // Adjust scaling based on label size
        sprite.position.set(node.position.x, node.position.y, node.position.y + node.size / 2 + 3);  // Offset slightly above the node
        this.scene.add(sprite);

        node.labelObject = sprite;  // Store label reference
    });

    // Render Edges
    edges.forEach(edge => {
        const sourceNode = nodes.find(n => n.id === edge.source);
        const targetNode = nodes.find(n => n.id === edge.target);

        if (sourceNode && targetNode) {
            const material = new THREE.LineBasicMaterial({ color: 0xffffff });
            const geometry = new THREE.BufferGeometry().setFromPoints([
                sourceNode.object.position,
                targetNode.object.position,
            ]);

            const line = new THREE.Line(geometry, material);
            this.scene.add(line);
        }
    });

    // Optionally, set the initial camera view based on the graph bounds
    // this.setInitialCameraView(nodes);
}



            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update(); // Required for damping
                this.renderer.render(this.scene, this.camera);
            }

        calculateGraphBoundingBox(nodes) {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;

            nodes.forEach(node => {
                minX = Math.min(minX, node.position.x);
                maxX = Math.max(maxX, node.position.x);
                minY = Math.min(minY, node.position.y);
                maxY = Math.max(maxY, node.position.y);
                minZ = Math.min(minZ, node.position.z);
                maxZ = Math.max(maxZ, node.position.z);
            });

            return { minX, maxX, minY, maxY, minZ, maxZ };
        }

        setInitialCameraView(nodes) {
            const { minX, maxX, minY, maxY, minZ, maxZ } = this.calculateGraphBoundingBox(nodes);

            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const centerZ = (minZ + maxZ) / 2;

            const width = maxX - minX;
            const height = maxY - minY;
            const depth = maxZ - minZ;

            const maxDimension = Math.max(width, height, depth);

            // Adjust camera position
            this.camera.position.set(centerX, centerY, maxDimension * 2);
            this.camera.lookAt(centerX, centerY, centerZ); // Look at the center of the graph

            // Adjust the camera's near and far planes based on the graph size
            this.camera.near = maxDimension / 10;
            this.camera.far = maxDimension * 10;
            this.camera.updateProjectionMatrix();
        }
    }

        // Create Viewer and Load Graph
        const viewer = new GEXFGraphViewer(document.body);
        viewer.loadGEXF('test.gexf'); // Replace with the path to your GEXF file
    </script>
</body>
</html>
