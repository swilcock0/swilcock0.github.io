<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloading…</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 3em 1em;
        color: #333;
      }
      .spinner {
        width: 2em;
        height: 2em;
        border: 3px solid #ccc;
        border-top-color: #007bff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 1em auto;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <h2>Preparing your download…</h2>
    <div class="spinner"></div>
    <p id="status">Please wait.</p>

    <script>
      /*
       * Safe GitHub Pages downloader with return to referring page.
       * Only allows relative files (e.g. docs/myfile.pdf)
       */
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(location.search);
        const file = params.get("file");
        const referer = document.referrer || "/"; // fallback to homepage if no referrer

        if (!file) {
          document.getElementById("status").textContent = "Missing ?file= parameter.";
          return;
        }

        // Only allow internal paths
        if (file.startsWith("http") || file.startsWith("//") || file.includes("..")) {
          document.getElementById("status").textContent = "Invalid or unsafe file path.";
          return;
        }

        const a = document.createElement("a");
        a.href = file;
        a.download = file.split("/").pop();
        document.body.appendChild(a);

        // Delay a bit for UX, then trigger download
        setTimeout(() => {
          a.click();
          document.getElementById("status").textContent = "Download started. Returning…";

          // Fallback link in case auto-redirect fails
          const fallback = document.createElement("p");
          fallback.innerHTML = `<a href="${referer}">Return to previous page</a>`;
          document.body.appendChild(fallback);

          a.remove();

          // Redirect back to referring page after short delay
          setTimeout(() => {
            window.location.href = referer;
          }, 1000);
        }, 600);
      });
    </script>
  </body>
</html>
