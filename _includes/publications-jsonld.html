{% comment %} The publications list as schema.org works, with Sam linked to the Person on the home page {% endcomment %}
{% assign works = site.data.publications | where_exp: 'p', 'p.note != "Patent application, pending"' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Publications by Sam Wilcock",
  "itemListElement": [{% for p in works %}
    { "@type": "ListItem", "position": {{ forloop.index }}, "item": {% include scholarly-work-jsonld.html p=p %} }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
