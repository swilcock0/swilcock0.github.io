<!-- Light/dark toggle: follows the OS until clicked, then remembers the choice -->
<script>
  (function () {
    var root = document.documentElement, button = document.querySelector('.theme-toggle');
    var os = matchMedia('(prefers-color-scheme: dark)');
    function current() { return root.dataset.theme || (os.matches ? 'dark' : 'light'); }
    function label() { button.setAttribute('aria-label', current() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'); }
    button.addEventListener('click', function () {
      root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      label();
      document.dispatchEvent(new Event('themechange'));
    });
    os.addEventListener('change', label);
    label();
  })();
</script>

<!-- Menu button on narrow screens -->
<script>
  (function () {
    var bar = document.querySelector('.bar'), button = bar.querySelector('.menu-toggle');
    function set(open) { bar.classList.toggle('open', open); button.setAttribute('aria-expanded', open); }
    button.addEventListener('click', function () { set(!bar.classList.contains('open')); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && bar.classList.contains('open')) { set(false); button.focus(); }
    });
  })();
</script>

<!-- Hides embedded 3D models (.outerIFrame) behind a "Load model" button until asked for -->
<script>
  document.querySelectorAll('.outerIFrame').forEach(function (box) {
    var frame = box.querySelector('iframe');
    var button = document.createElement('button');
    button.className = 'myButton';
    button.textContent = 'Load model';
    box.parentNode.insertBefore(button, box);
    box.hidden = true;
    button.addEventListener('click', function () {
      if (!frame.src || frame.src === 'about:blank') frame.src = frame.dataset.src;
      box.hidden = !box.hidden;
      button.textContent = box.hidden ? 'Load model' : 'Close model';
    });
  });
</script>
