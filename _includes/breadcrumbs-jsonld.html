{% comment %} Home > Posts > post, or Home > page {% endcomment %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": {{ site.title | jsonify }}, "item": {{ site.url | append: '/' | jsonify }} },{% if page.collection == 'posts' %}
    { "@type": "ListItem", "position": 2, "name": "Posts", "item": {{ site.url | append: '/posts/' | jsonify }} },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ site.url | append: page.url | jsonify }} }{% else %}
    { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ site.url | append: page.url | jsonify }} }{% endif %}
  ]
}
</script>
