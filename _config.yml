# Config
# ========================================================================================

# IMPORTANT: Set the URL of your site.
# Set to https://<username>.github.io when hosting on GitHub Pages
# (unless you are using a custom domain).
url:                   https://www.samwilcock.xyz

# IMPORTANT: Set The "base URL" of your site.
# When your site sits in a subdirectory, set to /<name of directory>
# (with leading /, but without the < >).
# Use the empty string '' otherwise.
# For GitHub project sites, this is usually the name of the project,
# e.g. `/hydejack`.
baseurl:               ''


# General settings
# ---------------------------------------------------------------------------------------

# Language of your content in 2-letter code, e.g.: en, de.
# You may also provide a location, e.g.: en-us, de_AT.
lang:                  en-gb

# The title of your blog. Used in the sidebar and the browser tab.
title:                 Sam Wilcock

# A short description (~150 chars) of the page used for the meta description tag.
# Can use markdown, but no more than one paragraph (enforced by `>`)
description:           >
  Sam Wilcock, research fellow at the Politecnico di Milano: robotic construction, digital fabrication and computational design for architecture.

# A shorter description for the sidebar.
tagline:               Robotic construction and digital fabrication

# A list of keywords for your blog
keywords:              [robotics, engineering, science, mathematics, rhino3d, architecture, generative, CAD, Politecnico di Milano, construction]

# A (square) logo for your site.
# If provided, it will be shown at the top of the sidebar.
# It also used by the `jekyll-seo-tag` plugin.
logo:                  /assets/img/logo.png

# This should be the same author as first entry in `_data/authors.yml`.
author:
  # Used by `jekyll-feed`:
  name:                Sam Wilcock
  email:               sam.wilcock@polimi.it
  # Used by `jekyll-seo-tag` for the author of every post in the structured data
  url:                 https://www.samwilcock.xyz/about/
  # # Used by `jekyll-seo-tag`:

# This text will appear in a `<small>` tag in the footer of every page.
copyright:             Sam Wilcock

# Format of the permalinks
permalink:             /:categories/:year-:month-:day-:title/



# Collections
# ----------------------------------------------------------------------------------------

collections:
  featured_categories:
    permalink:         /:name/
    output:            true

  featured_tags:
    permalink:         /tag-:name/
    output:            true

  projects:
    permalink:         /projects/:path/
    output:            true


defaults:
  # Don't include documents in assets in the sitemap
  - scope:
      path:            "assets/**"
    values:
      sitemap:         false

  - scope:
      path:            "Files/*.gh"
    values:
      sitemap:         false
  
  - scope:
      type:            pages
    values:
      image:           /assets/img/me.jpg

  # Personal documents and utility pages: reachable by direct link, not listed for search
  - scope:
      path:            "Files/BeCurious.pdf"
    values:
      sitemap:         false
  - scope:
      path:            "Files/Certificate_C-8XEH2M3UZ6.pdf"
    values:
      sitemap:         false
  - scope:
      path:            "Files/Sam Wilcock - Fellowship.pdf"
    values:
      sitemap:         false

  - scope:
      path:            "download.html"
    values:
      sitemap:         false

  - scope:
      path:            "googledae5203f89959b84.html"
    values:
      sitemap:         false

  - scope:
      path:            ".well-known/**"
    values:
      sitemap:         false

  # `jekyll-seo-tag` will mark collection outputs as `BlogPosting`,
  # but we want them to be `WebPage`s:
  - scope:
      type:            projects
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_categories
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_tags
    values:
      seo:
        type:          WebPage

kramdown:
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'


# 3rd Party Integrations
# ----------------------------------------------------------------------------------------

# Set your Google Analytics id to receive `pageview` events.
# To remove Google Anaylics from your page, remove the line below.
google_analytics:      UA-172781485-1

# Setting a disqus shortname will enable the comment section on
# pages with `comments: true` in the front matter.
# disqus:                Swilcock0

# Setting a tinyletter username will enable the newsletter subscription box.
# PRO version only!
# tinyletter:            <username>


# File inclusion/exclusion
# ----------------------------------------------------------------------------------------

exclude:
  - .jekyll-cache
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - Start.bat
  - Gemfile.lockBAK
  - samwilcock.xyz-audit
  - README.md
  - netlify.toml
include:
  - .well-known


# Plugins
# ----------------------------------------------------------------------------------------

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  - jekyll-last-modified-at
  - jemoji


# SEO Tag
# ---------------------------------------------------------------------------------------

# Where you proof that you own this site (used by jekyll-seo-tag)
# google_site_verification: <verification-id>
# -- or --
# webmaster_verifications:
#   google:              <verification-id>
#   bing:                <verification-id>
#   alexa:               <verification-id>
#   yandex:              <verification-id>

# Used for twitter cards
# twitter:
#   username:            <username>

# Used for facebook open graph
# facebook:
#   app_id:              <id>
#   publisher:           <id>
#   admins:              <id>

# Used on index and about sites
# social:
#   name:                <firstname> <lastname>
#   links:
#     - https://twitter.com/<username>
#     - https://github.com/<username>


# Plugin Configs
# ---------------------------------------------------------------------------------------
optional_front_matter:
  remove_originals:    true

readme_index:
  remove_originals:    true
  with_frontmatter:    true

relative_links:
  collections:         true

titles_from_headings:
  strip_title:         true
  collections:         true

compress_html:
  comments:            ["<!-- ", " -->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed

  
# Jekyll Compose Defaults
# ---------------------------------------------------------------------------------------

jekyll_compose:
  default_front_matter:
    drafts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/sidebar-bg.jpg
    posts:
      layout: post
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/sidebar-bg.jpg
    projects:
      layout: project
      description: > 
        A short ~160 character description of your post for search engines,
        social media previews, etc.
      image:
        path: /assets/img/sidebar-bg.jpg
      links:
        - title: Project Link
          url: https://example.com

# Allow setting off future posts
future: false
timezone: Europe/London

